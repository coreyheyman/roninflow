# Publishes the live demo (made-up data, runs entirely in the browser) to GitHub Pages on every push to main.
# One-time: repo Settings → Pages → Source: "GitHub Actions".
name: Demo site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Build the demo
        run: VITE_DEMO=1 npx vite build --base=/${{ github.event.repository.name }}/ --outDir demo-dist
      - run: touch demo-dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
