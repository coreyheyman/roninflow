# Publishes the live demo (made-up trades, runs entirely in the browser) to GitHub Pages on every push to main — and
# every few hours, so its Macro pages show a fresh snapshot of real public data (FRED, New York Fed, calendar, COT).
# One-time: repo Settings → Pages → Source: "GitHub Actions".
name: Demo site
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Snapshot real macro data for the demo
        run: node scripts/demo-macro-data.mjs public/demo-data
        continue-on-error: true
        timeout-minutes: 25
      - name: Build the demo
        run: VITE_DEMO=1 npx vite build --base=/${{ github.event.repository.name }}/ --outDir demo-dist
      - run: touch demo-dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
