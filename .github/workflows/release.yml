# Builds and publishes a release when you push a version tag (e.g. git tag v1.0.0 && git push --tags),
# or when started by hand from the Actions tab.
#   • tests + production build
#   • Docker image → ghcr.io/coreyheyman/roninflow:<version> and :latest (amd64 + arm64)
#   • Windows installer (Inno Setup, bundles a portable Node.js)
#   • GitHub Release with the installer and a source zip
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '22'
  NODE_WIN: 'v22.20.0'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Collect the app files the server needs
        run: |
          mkdir -p build/app/src/lib
          cp -r dist docs scripts LICENSE NOTICE.md README.md package.json build/app/
          cp server.js local-api.js candles.js connect.js connect-apis.js connect-markets.js secrets.js system.js ai-proxy.js atas-sync.js replica.js build/app/
          cp src/lib/pairing.js build/app/src/lib/
          for d in atas-addon ninjatrader-addon metatrader-addon ctrader-addon quantower-addon sierrachart-addon; do cp -r "$d" build/app/; done
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: build/app

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/roninflow" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ needs.build.outputs.version }}
            ${{ steps.name.outputs.image }}:latest

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: build/app
      - name: Portable Node.js
        shell: pwsh
        run: |
          $zip = "node-$env:NODE_WIN-win-x64.zip"
          Invoke-WebRequest "https://nodejs.org/dist/$env:NODE_WIN/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath build\nodezip
          New-Item -ItemType Directory -Force build\node | Out-Null
          Copy-Item "build\nodezip\node-$env:NODE_WIN-win-x64\node.exe" build\node\
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ needs.build.outputs.version }}" installer\windows\TradeJournal.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/out/*.exe

  release:
    needs: [build, docker, windows]
    runs-on: ubuntu-latest
    # a tag push, or started by hand from the Actions tab (then the tag v<package.json version> is created here)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: roninflow
      - run: cd roninflow && zip -qr ../RoninFlow-${{ needs.build.outputs.version }}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: RoninFlow ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: |
            out/*.exe
            RoninFlow-${{ needs.build.outputs.version }}.zip
